<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Flashcard Deck</title>
    </head>
<body>
    <h1>Create Your Flashcard Deck</h1>

    <div id="card-input-area">
        <h2>Add a New Card</h2>
        <label for="question-input">Question:</label>
        <input type="text" id="question-input" required><br><br>

        <label for="answer-input">Answer:</label>
        <input type="text" id="answer-input" required><br><br>

        <button id="add-card-btn">Add Card to Deck</button>
    </div>

    <hr>

    <div id="deck-preview-area">
        <h2>Deck Preview (<span id="card-count">0</span> Cards)</h2>
        <ul id="deck-list">
            </ul>
        <button id="save-deck-btn">Save Deck to Cloud</button>
        <p id="message-area" style="color: blue;"></p>
    </div>

    <script src="new_flashcard.js"></script>
</body>
</html>
