<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit/New Flashcard Deck</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="container">
        
        <!-- Header: Deck Name, Subject, and Utility Buttons -->
        <div class="header">
            <div class="deck-info">
                <input type="text" id="deck-name-input" placeholder="NEW DECK">
                <input type="text" id="subject-input" placeholder="SUBJECT/DESCRIPTION">
            </div>
            <div class="utility-buttons">
                <!-- Settings Icon (Cog) -->
                <button id="settings-btn" title="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.22a2 2 0 0 0-1.22 1.78l-.05.28a2 2 0 0 0-1.78 1.22l-.22.44a2 2 0 0 0-2 2h-.22a2 2 0 0 0-2 2v.44a2 2 0 0 0 2 2h.22a2 2 0 0 0 2 2l.22.44a2 2 0 0 0 1.78 1.22l.05.28a2 2 0 0 0 1.22 1.78v.22a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.22a2 2 0 0 0 1.22-1.78l.05-.28a2 2 0 0 0 1.78-1.22l.22-.44a2 2 0 0 0 2-2h.22a2 2 0 0 0 2-2v-.44a2 2 0 0 0-2-2h-.22a2 2 0 0 0-2-2l-.22-.44a2 2 0 0 0-1.78-1.22l-.05-.28a2 2 0 0 0-1.22-1.78V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
                <!-- Delete Icon (Trash) -->
                <button id="delete-deck-btn" title="Delete Deck">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash-2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                </button>
                <!-- Save Icon (Disk) -->
                <button id="save-deck-btn" title="Save Deck">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-save"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
                </button>
            </div>
        </div>

        <!-- Main Content Area: Sidebar and Editor -->
        <div class="content">
            
            <!-- Left Sidebar: Card List & Add Card Button -->
            <div class="card-sidebar">
                <button id="add-card-btn" class="add-new-card-button">+ New Card</button>
                
                <div class="card-list-wrapper">
                    <p>Cards in Deck: <span id="card-count">0</span></p>
                    <div id="deck-list">
                        <!-- Card buttons will go here -->
                    </div>
                </div>
            </div>

            <!-- Right Editor: Question and Answer Input -->
            <div class="card-editor">
                
                <div class="card-half question-area">
                    <textarea id="question-input" placeholder="+ question"></textarea>
                </div>
                
                <div class="divider"></div>
                
                <div class="card-half answer-area">
                    <textarea id="answer-input" placeholder="+ answer"></textarea>
                </div>
                
            </div>
        </div>

        <!-- Corrected message area class/style to use the CSS file -->
        <p id="message-area" class="feedback-message"></p>

    </div>

    <!-- Link the JavaScript file -->
    <script src="flashcards/new_flashcard.js"></script>
</body>
</html>
