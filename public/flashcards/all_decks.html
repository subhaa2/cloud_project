<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraLearn Decks</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/flashcards.css"> 
</head>
<body>
    <div class="container">
        
        <!-- Header for the Deck Overview -->
        <div class="header">
            <div class="deck-info">
                <h1>My Flashcard Library</h1>
                <p style="color: var(--color-highlight); font-weight: 500;">
                    Your decks are isolated and secured.
                </p>
            </div>
            <div class="utility-buttons">
                <!-- Start New Deck Button -->
                <button id="start-new-deck-btn" title="Create New Deck" class="add-new-card-button" style="background-color: var(--color-primary); color: var(--color-accent);">
                    <span> + Start New</span>
                </button>
            </div>
        </div>

        <!-- Main Content Area - Decks List -->
        <div id="decks-list-area" class="decks-list-area">
            <!-- Decks will be dynamically rendered here by JavaScript -->
            <p id="loading-message">Loading decks...</p>
        </div>

        <div id="delete-modal" style="position: fixed; inset: 0; background-color: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 100;">
        <div style="background-color: white; padding: 25px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); max-width: 400px; width: 90%;">
            <h3 style="font-size: 1.5rem; font-weight: 700; color: var(--color-danger); margin-bottom: 15px;">Confirm Deletion</h3>
            <p style="margin-bottom: 25px;">Are you sure you want to permanently delete this deck? This cannot be undone.</p>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button id="cancel-delete" class="utility-buttons button" style="background-color: var(--color-secondary); color: var(--color-text-dark);">Cancel</button>
                <button id="confirm-delete" class="utility-buttons button" style="background-color: var(--color-danger); color: white;">Delete</button>
            </div>
        </div>
    </div>
        
    </div>
    <!-- 
        The script path assumes all_decks.js is inside a 'flashcards' folder 
        relative to this HTML file.
    -->
    <script src="flashcards/all_decks.js"></script>
</body>
</html>
