<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraLearn Decks</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css"> 
</head>
<body>
    <div class="container">
        
        <!-- Header for the Deck Overview -->
        <div class="header">
            <div class="deck-info">
                <h1>My Flashcard Library</h1>
                <p style="color: var(--color-highlight); font-weight: 500;">
                    Your decks are isolated and secured.
                </p>
            </div>
            <div class="utility-buttons">
                <!-- Start New Deck Button -->
                <button id="start-new-deck-btn" title="Create New Deck" class="add-new-card-button" style="background-color: var(--color-primary); color: var(--color-accent);">
                    <span> + Start New</span>
                </button>
            </div>
        </div>

        <!-- Main Content Area - Decks List -->
        <div id="decks-list-area" class="decks-list-area">
            <!-- Decks will be dynamically rendered here by JavaScript -->
            <p id="loading-message">Loading decks...</p>
        </div>
        
    </div>
    <!-- 
        The script path assumes all_decks.js is inside a 'flashcards' folder 
        relative to this HTML file.
    -->
    <script src="flashcards/all_decks.js"></script>
</body>
</html>
