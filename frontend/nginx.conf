# In ./frontend/nginx.conf
server {
    # Cloud Run exposes port 8080 as the default.
    listen 8080;

    # Set the root directory for your static files
    root /usr/share/nginx/html;

    # Define the index file
    index index.html;

    # Handle all requests: try to serve the requested file, 
    # then try to serve it as a directory, then fall back to index.html 
    # for client-side routing (SPA).
    location / {
        try_files $uri $uri/ /index.html;
    }
}